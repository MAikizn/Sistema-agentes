<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>BLACK FRIDAY — WHEY PROTEIN 30% OFF</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px;
    height: 1350px;
    margin: 0;
    overflow: hidden;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background:
      radial-gradient(ellipse at 50% 38%, rgba(212,175,55,.12) 0%, transparent 55%),
      radial-gradient(ellipse at 50% 95%, rgba(212,175,55,.08) 0%, transparent 40%),
      #0a0a0a;
    color: #fff;
    position: relative;
  }

  /* Diagonais sutis de energia */
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(115deg, transparent 46%, rgba(255,255,255,.04) 46%, rgba(255,255,255,.04) 48%, transparent 48%),
      linear-gradient(115deg, transparent 63%, rgba(212,175,55,.05) 63%, rgba(212,175,55,.05) 64.5%, transparent 64.5%);
    pointer-events: none;
  }

  /* Brilho atrás do pote */
  .glow {
    position: absolute;
    top: 300px;
    left: 50%;
    transform: translateX(-50%);
    width: 720px;
    height: 720px;
    background: radial-gradient(circle at center, rgba(212,175,55,.18) 0%, transparent 60%);
    filter: blur(10px);
    pointer-events: none;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    padding: 64px 80px 72px;
    display: flex;
    flex-direction: column;
  }

  /* Cabeçalho */
  .tag {
    align-self: flex-start;
    font-size: 22px;
    letter-spacing: 8px;
    font-weight: 700;
    color: #D4AF37;
    padding: 10px 22px;
    border: 2px solid #D4AF37;
    border-radius: 40px;
    background: rgba(212,175,55,.06);
    text-transform: uppercase;
  }

  .title-line {
    margin-top: 30px;
    font-size: 92px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #fff;
    line-height: 0.95;
    font-family: 'Impact','Arial Black','Segoe UI',sans-serif;
    text-transform: uppercase;
  }
  .title-line .strike {
    position: relative;
    display: inline-block;
    color: #D4AF37;
  }
  .title-line .strike::after {
    content: "";
    position: absolute;
    left: -4%;
    width: 108%;
    top: 55%;
    height: 10px;
    background: linear-gradient(90deg, transparent, #D4AF37 30%, #FFF 50%, #D4AF37 70%, transparent);
    transform: rotate(-4deg);
    box-shadow: 0 0 18px rgba(212,175,55,.6);
  }

  .subtitle {
    margin-top: 22px;
    font-size: 30px;
    font-weight: 600;
    letter-spacing: 3px;
    color: rgba(255,255,255,.85);
    text-transform: uppercase;
  }

  /* Área central */
  .mid {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    margin-top: 30px;
  }

  .jar-wrap {
    position: relative;
    width: 520px;
  }

  .jar {
    width: 260px;
    margin: 0 auto;
    display: block;
    filter: drop-shadow(0 30px 40px rgba(0,0,0,.6));
    animation: floaty 5s ease-in-out infinite;
  }
  @keyframes floaty {
    0%,100% { transform: translateY(0) rotate(-2deg); }
    50%    { transform: translateY(-14px) rotate(2deg); }
  }

  .rays {
    position: absolute;
    inset: -40px;
    width: auto;
    pointer-events: none;
    opacity: .35;
    animation: spin 40s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .badge {
    position: absolute;
    top: -30px;
    right: -70px;
    width: 240px;
    height: 240px;
    transform: rotate(8deg);
  }

  .price {
    position: absolute;
    left: -80px;
    bottom: 40px;
    width: 240px;
    padding: 22px 18px;
    background: linear-gradient(180deg, #ffffff 0%, #f1f1f1 100%);
    color: #111;
    text-align: center;
    border-radius: 6px;
    box-shadow: 0 20px 30px rgba(0,0,0,.45);
    transform: rotate(-8deg);
  }
  .price .old {
    font-size: 26px;
    color: #9a9a9a;
    text-decoration: line-through;
    font-weight: 600;
  }
  .price .new {
    margin-top: 6px;
    display: block;
    font-size: 46px;
    font-weight: 800;
    color: #0a0a0a;
    line-height: 1;
  }
  .price .new span { font-size: 28px; vertical-align: top; }
  .price .off {
    margin-top: 8px;
    display: inline-block;
    background: #D4AF37;
    color: #0a0a0a;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 2px;
    padding: 6px 12px;
    border-radius: 4px;
  }

  /* Benefícios */
  .benefits {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-top: 10px;
  }
  .chip {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(212,175,55,.35);
    border-radius: 8px;
  }
  .chip svg {
    width: 28px;
    height: 28px;
    flex-shrink: 0;
    color: #D4AF37;
  }
  .chip .t {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: #fff;
    line-height: 1.1;
    text-transform: uppercase;
  }

  /* CTA */
  .cta-wrap {
    margin-top: 34px;
    text-align: center;
  }
  .cta {
    display: inline-block;
    padding: 26px 70px;
    background: linear-gradient(180deg, #ffd86b 0%, #D4AF37 55%, #b8912b 100%);
    color: #0a0a0a;
    font-size: 34px;
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
    border-radius: 60px;
    box-shadow: 0 18px 30px rgba(212,175,55,.35), inset 0 2px 0 rgba(255,255,255,.6);
  }
  .cta-sub {
    margin-top: 18px;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 2px;
    color: rgba(255,255,255,.75);
  }
  .cta-sub b { color: #D4AF37; font-weight: 800; }

  /* Rodapé */
  .footer {
    margin-top: 36px;
    padding-top: 22px;
    border-top: 1px solid rgba(255,255,255,.12);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .store {
    font-family: 'Impact','Arial Black',sans-serif;
    font-size: 32px;
    letter-spacing: 4px;
    color: #fff;
    text-transform: uppercase;
  }
  .store em { font-style: normal; color: #D4AF37; }
  .trust {
    display: flex;
    gap: 22px;
  }
  .trust .it {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 1px;
    color: rgba(255,255,255,.85);
    text-transform: uppercase;
  }
  .trust svg { width: 24px; height: 24px; color: #D4AF37; }
</style>
</head>
<body>
  <div class="glow"></div>

  <div class="stage">
    <div class="tag">Oferta por tempo limitado</div>
    <div class="title-line">BLACK <span class="strike">FRIDAY</span></div>
    <div class="subtitle">30% OFF no seu Whey Protein</div>

    <div class="mid">
      <div class="jar-wrap">
        <!-- Raios -->
        <svg class="rays" viewBox="0 0 400 400" aria-hidden="true">
          <g fill="none" stroke="#D4AF37" stroke-width="2">
            <line x1="200" y1="20"  x2="200" y2="80"/>
            <line x1="200" y1="320" x2="200" y2="380"/>
            <line x1="20"  y1="200" x2="80"  y2="200"/>
            <line x1="320" y1="200" x2="380" y2="200"/>
            <line x1="60"  y1="60"  x2="105" y2="105"/>
            <line x1="295" y1="295" x2="340" y2="340"/>
            <line x1="340" y1="60"  x2="295" y2="105"/>
            <line x1="105" y1="295" x2="60"  y2="340"/>
          </g>
        </svg>

        <!-- Pote de Whey -->
        <svg class="jar" viewBox="0 0 260 500" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="lidTop" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#f0d478"/>
              <stop offset=".5" stop-color="#D4AF37"/>
              <stop offset="1" stop-color="#8a6a1c"/>
            </linearGradient>
            <linearGradient id="lidBody" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#b8912b"/>
              <stop offset=".5" stop-color="#D4AF37"/>
              <stop offset="1" stop-color="#6a4f10"/>
            </linearGradient>
            <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#1a1a1a"/>
              <stop offset=".2" stop-color="#2c2c2c"/>
              <stop offset=".5" stop-color="#3a3a3a"/>
              <stop offset=".8" stop-color="#2c2c2c"/>
              <stop offset="1" stop-color="#111"/>
            </linearGradient>
            <linearGradient id="label" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f4f4f4"/>
              <stop offset="1" stop-color="#dcdcdc"/>
            </linearGradient>
            <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#fff" stop-opacity="0"/>
              <stop offset=".5" stop-color="#fff" stop-opacity=".28"/>
              <stop offset="1" stop-color="#fff" stop-opacity="0"/>
            </linearGradient>
          </defs>

          <!-- Tampa -->
          <ellipse cx="130" cy="45" rx="92" ry="16" fill="url(#lidBody)"/>
          <rect x="38" y="45" width="184" height="55" fill="url(#lidBody)"/>
          <path d="M38 45 Q130 30 222 45 L222 60 Q130 42 38 60 Z" fill="url(#lidTop)"/>
          <ellipse cx="130" cy="45" rx="92" ry="16" fill="none" stroke="#8a6a1c" stroke-width="1.5"/>

          <!-- Pescoço -->
          <path d="M50 100 L210 100 L210 135 L50 135 Z" fill="#1a1a1a"/>

          <!-- Corpo -->
          <path d="M45 135
                   C 35 170, 35 320, 48 440
                   C 50 475, 80 485, 130 485
                   C 180 485, 210 475, 212 440
                   C 225 320, 225 170, 215 135
                   Z"
                fill="url(#bottle)"/>

          <!-- Brilho lateral -->
          <path d="M60 150 C 55 250, 55 360, 62 450 L 82 450 C 75 360, 75 250, 82 150 Z"
                fill="url(#shine)"/>

          <!-- Rótulo -->
          <g>
            <path d="M55 180 L205 180 Q212 180 212 190 L212 400 Q212 410 205 410 L55 410 Q48 410 48 400 L48 190 Q48 180 55 180 Z"
                  fill="url(#label)" stroke="#2c2c2c" stroke-width="2"/>

            <!-- Faixa dourada superior -->
            <rect x="48" y="180" width="164" height="42" fill="#D4AF37"/>
            <text x="130" y="207" text-anchor="middle"
                  font-family="Arial, sans-serif" font-weight="900"
                  font-size="22" letter-spacing="4" fill="#0a0a0a">WHEY PROTEIN</text>

            <!-- Marca -->
            <text x="130" y="265" text-anchor="middle"
                  font-family="Arial, sans-serif" font-weight="900"
                  font-size="40" letter-spacing="2" fill="#0a0a0a">TITAN</text>
            <text x="130" y="285" text-anchor="middle"
                  font-family="Arial, sans-serif" font-weight="700"
                  font-size="14" letter-spacing="6" fill="#8a6a1c">PRO SERIES</text>

            <!-- Selo circular -->
            <circle cx="130" cy="340" r="34" fill="#0a0a0a"/>
            <circle cx="130" cy="340" r="34" fill="none" stroke="#D4AF37" stroke-width="2"/>
            <text x="130" y="335" text-anchor="middle"
                  font-family="Arial, sans-serif" font-weight="900"
                  font-size="26" fill="#D4AF37">25g</text>
            <text x="130" y="355" text-anchor="middle"
                  font-family="Arial, sans-serif" font-weight="700"
                  font-size="11" letter-spacing="2" fill="#fff">PROTEÍNA</text>

            <!-- Dimensão -->
            <text x="130" y="395" text-anchor="middle"
                  font-family="Arial, sans-serif" font-weight="800"
                  font-size="16" letter-spacing="3" fill="#0a0a0a">900g — CHOCOLATE</text>
          </g>
        </svg>

        <!-- Badge 30% OFF -->
        <svg class="badge" viewBox="0 0 240 240" aria-hidden="true">
          <defs>
            <linearGradient id="bp" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffd86b"/>
              <stop offset="1" stop-color="#b8912b"/>
            </linearGradient>
          </defs>
          <circle cx="120" cy="120" r="112" fill="url(#bp)"/>
          <circle cx="120" cy="120" r="112" fill="none" stroke="#0a0a0a" stroke-width="6" stroke-dasharray="4 6"/>
          <circle cx="120" cy="120" r="92" fill="#0a0a0a"/>
          <text x="120" y="105" text-anchor="middle"
                font-family="Arial, sans-serif" font-weight="900"
                font-size="58" fill="#D4AF37">30%</text>
          <text x="120" y="155" text-anchor="middle"
                font-family="Arial, sans-serif" font-weight="900"
                font-size="34" letter-spacing="4" fill="#fff">OFF</text>
        </svg>

        <!-- Preço -->
        <div class="price">
          <div class="old">De R$ 129,90</div>
          <span class="new"><span>R$</span> 90,90</span>
          <div class="off">-30%</div>
        </div>
      </div>
    </div>

    <!-- Benefícios -->
    <div class="benefits">
      <div class="chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2l2.4 5.6L20 8.6l-4.4 4 1.3 6L12 15.8 7.1 18.6l1.3-6L4 8.6l5.6-1z"/>
        </svg>
        <div class="t">Recuperação<br>múscular</div>
      </div>
      <div class="chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 20V10a6 6 0 0112 0v10"/>
          <path d="M4 20h16"/>
        </svg>
        <div class="t">Absorção<br>rápida</div>
      </div>
      <div class="chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6L9 17l-5-5"/>
        </svg>
        <div class="t">Frete<br>grátis</div>
      </div>
    </div>

    <!-- CTA -->
    <div class="cta-wrap">
      <div class="cta">GARANTA O SEU AGORA</div>
      <div class="cta-sub">Só até <b>sexta-feira</b> — estoque limitado</div>
    </div>

    <!-- Rodapé -->
    <div class="footer">
      <div class="store">NITRO <em>STUD</em></div>
      <div class="trust">
        <div class="it">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="10" width="18" height="11" rx="2"/>
            <path d="M7 10V7a5 5 0 0110 0v3"/>
          </svg>
          Pagamento seguro
        </div>
        <div class="it">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 7v5l3 2"/>
          </svg>
          Entrega expressa
        </div>
      </div>
    </div>
  </div>
</body>
</html>
