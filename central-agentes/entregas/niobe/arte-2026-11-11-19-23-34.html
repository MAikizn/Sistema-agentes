<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Dentista - Sorriso Saudável</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    font-family: system-ui, Arial, sans-serif;
}
body {
    background: linear-gradient(135deg, #4CAF50, #2E7D32);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
}
.container {
    position: relative;
    width: 90%;
    max-width: 900px;
    text-align: center;
}
h1 {
    font-size: 72px;
    margin: 0 0 20px;
    letter-spacing: -2px;
}
p {
    font-size: 32px;
    margin: 0 0 40px;
}
button {
    font-size: 28px;
    padding: 15px 30px;
    background: #fff;
    color: #2E7D32;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background .3s;
}
button:hover {
    background: #e0e0e0;
}
svg {
    position: absolute;
    top: -80px;
    left: 50%;
    transform: translateX(-50%);
    width: 300px;
    height: auto;
    fill: #fff;
    opacity: 0.2;
}
</style>
</head>
<body>
<div class="container">
<svg viewBox="0 0 64 64" aria-hidden="true">
  <path d="M32 2c-7 5-12 9-12 18 0 5 2 9 6 13-4 4-6 8-6 13 0 9 5 13 12 18 7-5 12-9 12-18 0-5-2-9-6-13 4-4 6-8 6-13 0-9-5-13-12-18z"/>
</svg>
<h1>Sorria com Saúde</h1>
<p>Clínica Odontológica</p>
<button>Agende sua Consulta</button>
</div>
</body>
</html>
