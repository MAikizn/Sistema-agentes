<div class="filtros">
  <div class="campo busca-container">
    <input type="text" id="busca" placeholder="Buscar por nome ou telefone..." onkeyup="filtrarTabela()">
  </div>
  <select id="filtroDentista" onchange="filtrarTabela()">
    <option value="">Todos os dentistas</option>
  </select>
  <select id="filtroEtapa" onchange="filtrarTabela()">
    <option value="">Todas as etapas</option>
  </select>

<div class="tabela-conteiner">
  <table class="tabela" id="tabelaPacientes">
    <thead>
      <tr>
        <th>Lead</th>
        <th>Telefone</th>
        <th>Última Consulta</th>
        <th>Próximo Retorno</th>
        <th>Etapa</th>
        <th>Dentista</th>
      </tr>
    </thead>
    <tbody id="corpoTabela">
      <!-- Dados gerados via JS -->
    </tbody>
  </table>
</div>

<script>
  // Os leads vêm do banco (/api/pacientes), só da subconta de quem está logado.
  let pacientes = [];
  const data = ms => ms ? new Date(ms).toLocaleDateString('pt-BR') : '-';
  const telefone = d => { d = String(d || ''); const m = d.match(/^(?:55)?(\d{2})(\d{4,5})(\d{4})$/); return m ? `(${m[1]}) ${m[2]}-${m[3]}` : d; };

  function renderizar(dados) {
    const corpo = document.getElementById('corpoTabela');
    if (!dados.length) { corpo.innerHTML = `<tr><td colspan="6" class="mudo" style="text-align:center">${pacientes.length ? 'Nenhum lead encontrado com esses filtros.' : 'Nenhum lead ainda. Clique em "Novo lead" ou crie um card no Funil.'}</td></tr>`; return; }
    corpo.innerHTML = dados.map(p => `
      <tr>
        <td><strong><a href="paciente.html?id=${encodeURIComponent(p.id)}" style="color:var(--marca); text-decoration:none;">${esc(p.nome)}</a></strong></td>
        <td>${esc(telefone(p.celular))}</td>
        <td>${esc(data(p.ultimaConsulta))}</td>
        <td>${esc(data(p.proximoRetorno))}</td>
        <td>${p.etapa ? `<span class="etiqueta etiqueta-info">${esc(p.etapa)}</span>` : '<span class="mudo">-</span>'}</td>
        <td>${esc(p.dentista || '-')}</td>
      </tr>
    `).join('');
  }

  function filtrarTabela() {
    const busca = document.getElementById('busca').value.toLowerCase();
    const soNumeros = busca.replace(/\D/g, '');
    const dentista = document.getElementById('filtroDentista').value;
    const etapa = document.getElementById('filtroEtapa').value;
    renderizar(pacientes.filter(p =>
      (p.nome.toLowerCase().includes(busca) || (soNumeros && p.celular.includes(soNumeros))) &&
      (dentista === '' || p.dentistaId === dentista) &&
      (etapa === '' || p.etapa === etapa)
    ));
  }

  function opcoes(sel, lista) {
    const atual = sel.value; while (sel.options.length > 1) sel.remove(1);
    lista.forEach(([v, t]) => { const o = document.createElement('option'); o.value = v; o.textContent = t; sel.appendChild(o); });
    sel.value = atual;
  }

  function carregar() {
    return MATRIX.api('GET', 'pacientes').then(d => {
      pacientes = d.pacientes;
      const etapas = [...new Set(pacientes.map(p => p.etapa).filter(Boolean))].sort();
      opcoes(document.getElementById('filtroEtapa'), etapas.map(e => [e, e]));
      filtrarTabela();
    }).catch(er => {
      document.getElementById('corpoTabela').innerHTML = `<tr><td colspan="6" class="mudo" style="text-align:center">${esc(er.message)}</td></tr>`;
    });
  }

  function novoLead() {
    const nome = (prompt('Nome do lead:') || '').trim(); if (!nome) return;
    const celular = (prompt('Celular com DDD (opcional):') || '').trim();
    MATRIX.api('POST', 'pacientes', { nome: nome, celular: celular })
      .then(r => { location.href = 'paciente.html?id=' + encodeURIComponent(r.id); })
      .catch(er => MATRIX.alertar(er.message));
  }

  document.addEventListener('DOMContentLoaded', () => {
    MATRIX.api('GET', 'equipe').then(d => opcoes(document.getElementById('filtroDentista'), d.equipe.map(u => [u.id, u.nome]))).catch(() => {});
    carregar();
  });
</script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // 1. Marcação do link ativo conforme página atual
      var pathAtual = window.location.pathname.split('/').pop();
      if (!pathAtual) pathAtual = 'painel.html';
      
      var linksNav = document.querySelectorAll('.lateral nav a');
      linksNav.forEach(function(link) {
        var href = link.getAttribute('href');
        if (href === pathAtual) {
          link.classList.add('ativo');
        } else {
          link.classList.remove('ativo');
        }
      });

      // 2. Controle do Menu Lateral no Celular
      var btnMenu = document.getElementById('btn-menu-toggle');
      var lateral = document.querySelector('.lateral');
      var overlay = document.getElementById('overlay');

      function fecharMenu() {
        if (lateral) lateral.classList.remove('aberta');
        if (overlay) overlay.classList.remove('aberta');
      }

      function abrirMenu() {
        if (lateral) lateral.classList.add('aberta');
        if (overlay) overlay.classList.add('aberta');
      }

      if (btnMenu) {
        btnMenu.addEventListener('click', function(e) {
          e.stopPropagation();
          if (lateral && lateral.classList.contains('aberta')) {
            fecharMenu();
          } else {
            abrirMenu();
          }
        });
      }

      if (overlay) {
        overlay.addEventListener('click', fecharMenu);
      }

      // 3. Gerenciador de Tema (Claro / Escuro)
      var btnTema = document.getElementById('btn-tema-toggle');
      var iconeTema = document.getElementById('icone-tema');
      
      var temaSalvo = localStorage.getItem('matrix-tema') || 'escuro';
      
      function aplicarTema(tema) {
        if (tema === 'claro') {
          document.documentElement.setAttribute('data-tema', 'claro');
          if (iconeTema) {
            iconeTema.innerHTML = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';
          }
        } else {
          document.documentElement.removeAttribute('data-tema');
          if (iconeTema) {
            iconeTema.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
          }
        }
      }

      aplicarTema(temaSalvo);

      if (btnTema) {
        btnTema.addEventListener('click', function() {
          var temaAtual = document.documentElement.getAttribute('data-tema') === 'claro' ? 'claro' : 'escuro';
          var novoTema = temaAtual === 'claro' ? 'escuro' : 'claro';
          localStorage.setItem('matrix-tema', novoTema);
          aplicarTema(novoTema);
        });
      }

      // 4. Aplicação dinâmica das cores de marca salvas
      var corMarca = localStorage.getItem('matrix-marca');
      var corMarca2 = localStorage.getItem('matrix-marca-2');

      if (corMarca) {
        document.documentElement.style.setProperty('--marca', corMarca);
      }
      if (corMarca2) {
        document.documentElement.style.setProperty('--marca-2', corMarca2);
      }
    });
  </script>
