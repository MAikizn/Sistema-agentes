<style>

    display: flex;

    padding-bottom: var(--espaco-md);
    min-height: calc(100vh - 240px);

  /* Customizacao da Coluna Kanban */

  .coluna-corpo {

    display: flex;
    flex-direction: column;
    gap: var(--espaco-md);
    overflow-y: auto;
    flex-grow: 1;
    min-height: 150px;
  }

  /* Cartao Kanban Customizado */
  .cartao-paciente {
    background-color: var(--superficie-2);
    border: 1px solid var(--borda);
    border-radius: var(--raio);
    padding: var(--espaco-md);

    flex-direction: column;

<script>
  // Estrutura de Colunas por Funil
  // Cada cliente (subconta) monta as próprias etapas. O padrão é só "Novo lead".
  // As etapas e os cards vêm do banco (/api/funil); cada subconta tem os seus.
  const ESTRUTURA_FUNIS = { atendimento: [], procedimentos: [] };
  let cartoesDados = [];
  let funilAtual = 'atendimento';
  let dentistaFiltro = 'todos';
  const avisar = t => (window.MATRIX && MATRIX.alertar ? MATRIX.alertar(t) : alert(t));

  function carregarFunil() {
    return MATRIX.api('GET', 'funil').then(d => {
      ESTRUTURA_FUNIS.atendimento = d.etapas;
      cartoesDados = d.cards.map(c => ({ id: c.id, funil: 'atendimento', colunaId: c.etapaId, nome: c.nome, dente: c.etiqueta, dentista: c.responsavel, dentistaId: c.responsavelId || '', valor: c.valor, situacao: c.situacao, etiquetaClasse: c.classe, pacienteId: c.pacienteId }));
      renderizarKanban();
    }).catch(er => {
      document.getElementById('kanbanMural').innerHTML = `<p class="mudo" style="padding:var(--espaco-md)">${esc(er.message)}</p>`;
    });
  }
  function carregarEquipe() {
    return MATRIX.api('GET', 'equipe').then(d => {
      const filtro = document.getElementById('filtroDentista'), form = document.getElementById('inputDentista');
      d.equipe.forEach(u => {
        [filtro, form].forEach(sel => { const o = document.createElement('option'); o.value = u.id; o.textContent = u.nome; sel.appendChild(o); });
      });
    }).catch(() => {});
  }
  function adicionarEtapa() {
    const campo = document.getElementById('novaEtapaNome'), nome = campo.value.trim().slice(0, 40); if (!nome) { campo.focus(); return; }
    MATRIX.api('POST', 'funil/etapas', { nome: nome }).then(() => { campo.value = ''; return carregarFunil(); }).catch(er => avisar(er.message));
  }
  function removerEtapa(id) {
    const etapa = ESTRUTURA_FUNIS.atendimento.find(e => e.id === id); if (!etapa) return;
    if (!confirm('Remover a etapa "' + etapa.nome + '"? Os cards dela voltam para a primeira etapa.')) return;
    MATRIX.api('DELETE', 'funil/etapas/' + encodeURIComponent(id)).then(carregarFunil).catch(er => avisar(er.message));
  }

  // Inicialização (perfil.js já carregou quando este evento dispara)
  document.addEventListener('DOMContentLoaded', () => {
    carregarEquipe();
    carregarFunil();
  });

  // Alterna entre Funil Atendimento e Procedimentos
  function alternarFunil(tipoFunil) {
    funilAtual = tipoFunil;


    renderizarKanban();
  }

  // Aplica filtro por dentista
  function aplicarFiltros() {
    dentistaFiltro = document.getElementById('filtroDentista').value;
    renderizarKanban();
  }

  // Formatação de Moeda em R$
  function formatarMoeda(valor) {
    return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }

  // Renderiza todo o Kanban baseado na estrutura e filtros atuais
  function renderizarKanban() {
    const mural = document.getElementById('kanbanMural');
    mural.innerHTML = '';

    const colunasDefinidas = ESTRUTURA_FUNIS[funilAtual];

    colunasDefinidas.forEach(coluna => {
      // Filtrar cartões pertencentes a esta coluna e ao funil/dentista selecionado
      const cartoesColuna = cartoesDados.filter(c => {
        const pertenceFunil = c.funil === funilAtual;
        const pertenceColuna = c.colunaId === coluna.id;
        const pertenceDentista = dentistaFiltro === 'todos' || c.dentistaId === dentistaFiltro;
        return pertenceFunil && pertenceColuna && pertenceDentista;
      });

      // Calcular soma total da coluna
      const totalValor = cartoesColuna.reduce((acc, c) => acc + c.valor, 0);

      // Elemento HTML da Coluna
      const colunaEl = document.createElement('div');
      colunaEl.className = 'coluna-funil';
      colunaEl.setAttribute('data-coluna-id', coluna.id);

      // Eventos Drag and Drop na coluna
      colunaEl.addEventListener('dragover', e => handleDragOver(e, colunaEl));
      colunaEl.addEventListener('dragleave', e => handleDragLeave(e, colunaEl));
      colunaEl.addEventListener('drop', e => handleDrop(e, coluna.id, colunaEl));

      // Cabeçalho da coluna
      colunaEl.innerHTML = `
        <div class="coluna-topo">
          <div class="coluna-titulo-linha">
            <span class="coluna-nome">${esc(coluna.nome)}</span>
            <span class="coluna-badge-qtd">${cartoesColuna.length}</span>
            ${coluna.id === (colunasDefinidas[0] && colunasDefinidas[0].id) ? '' : `<button type="button" class="btn btn-icone btn-suave" title="Remover etapa" aria-label="Remover etapa" onclick="removerEtapa('${esc(coluna.id)}')" style="width:26px;height:26px;padding:0">✕</button>`}
          </div>
          
        </div>
        <div class="coluna-corpo" id="corpo-${esc(coluna.id)}"></div>
      `;

      mural.appendChild(colunaEl);

      const corpoEl = colunaEl.querySelector(`#corpo-${esc(coluna.id)}`);

      // Renderizar Cartões dentro da coluna
      if (cartoesColuna.length === 0) {
        corpoEl.innerHTML = `
          <div style="text-align: center; color: var(--texto-mudo); font-size: 0.8rem; padding: var(--espaco-md) 0; border: 1px dashed var(--borda); border-radius: var(--raio-sm);">
            Arraste um card aqui
          </div>
        `;
      } else {
        cartoesColuna.forEach(card => {
          const cardEl = criarElementoCartao(card);
          corpoEl.appendChild(cardEl);
        });
      }
    });
  }

  // Cria o elemento HTML do Cartão Kanban
  function criarElementoCartao(card) {
    const el = document.createElement('div');
    el.className = 'cartao-paciente';
    el.setAttribute('draggable', 'true');
    el.setAttribute('data-card-id', card.id);

    // Eventos de Drag no Cartão
    el.addEventListener('dragstart', e => handleDragStart(e, card.id));
    el.addEventListener('dragend', handleDragEnd);

    const tagDenteHTML = card.dente 
      ? `<span class="cartao-dente">
          <svg viewBox="0 0 24 24" style="width: 12px; height: 12px; fill: currentColor;"><path d="M12 2C8.5 2 6 4.5 6 8c0 3 1.5 5 2 9 .4 3.2 1.5 5 4 5s3.6-1.8 4-5c.5-4 2-6 2-9 0-3.5-2.5-6-6-6z"/></svg>
          ${esc(card.dente)}
         </span>`
      : '';

    el.innerHTML = `
      <div class="cartao-cabecalho">
        <span class="cartao-nome">${card.pacienteId ? `<a href="paciente.html?id=${encodeURIComponent(card.pacienteId)}" draggable="false" style="color:inherit;text-decoration:none">${esc(card.nome)}</a>` : esc(card.nome)}</span>
        ${tagDenteHTML}
      </div>
      
      <div class="cartao-detalhes">
        <div class="cartao-dentista">
          <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          ${esc(card.dentista)}
        </div>
      </div>

      <div class="cartao-rodape">
        
        <span class="etiqueta ${esc(card.etiquetaClasse)}">${esc(card.situacao)}</span>
      </div>
    `;

    return el;
  }

  // Lógica de Arrastar e Soltar (HTML5 Drag and Drop)
  let cardIdSendoArrastado = null;

  function handleDragStart(e, cardId) {
    cardIdSendoArrastado = cardId;
    e.dataTransfer.setData('text/plain', cardId);
    e.dataTransfer.effectAllowed = 'move';
    
    // Adiciona classe visual com pequeno atraso para melhor efeito no browser
    setTimeout(() => {
      if (e.target) e.target.classList.add('arrastando');
    }, 0);
  }

  function handleDragEnd(e) {
    if (e.target) e.target.classList.remove('arrastando');
    cardIdSendoArrastado = null;
  }

  function handleDragOver(e, colunaEl) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    colunaEl.classList.add('drag-over');
  }

  function handleDragLeave(e, colunaEl) {
    colunaEl.classList.remove('drag-over');
  }

  function handleDrop(e, novaColunaId, colunaEl) {
    e.preventDefault();
    colunaEl.classList.remove('drag-over');

    if (!cardIdSendoArrastado) return;

    // Localizar o cartão no array e atualizar sua coluna
    const card = cartoesDados.find(c => c.id === cardIdSendoArrastado);
    if (card && card.colunaId !== novaColunaId) {
      const anterior = card.colunaId;
      card.colunaId = novaColunaId;
      renderizarKanban(); // mostra na hora; se o servidor recusar, volta o card
      MATRIX.api('PATCH', 'oportunidades/' + encodeURIComponent(card.id), { etapaId: novaColunaId })
        .catch(er => { card.colunaId = anterior; renderizarKanban(); avisar(er.message); });
    }
  }

  // Lógica do Modal de Novo Card
  function abrirModalNovoCard() {
    const modal = document.getElementById('modalNovoCard');
    const selectColuna = document.getElementById('inputColuna');
    
    // Preenche as opções de coluna com base no funil ativo
    selectColuna.innerHTML = '';
    ESTRUTURA_FUNIS[funilAtual].forEach(col => {
      const opt = document.createElement('option');
      opt.value = col.id;
      opt.textContent = col.nome;
      selectColuna.appendChild(opt);
    });

    document.getElementById('formNovoCard').reset();
    modal.classList.add('aberto');
  }

  function fecharModalNovoCard() {
    document.getElementById('modalNovoCard').classList.remove('aberto');
  }

  function salvarNovoCard(e) {
    e.preventDefault();

    const [situacao, classe] = document.getElementById('inputSituacao').value.split('|');
    const botao = e.submitter || document.querySelector('#formNovoCard [type=submit]');
    if (botao) botao.disabled = true;
    MATRIX.api('POST', 'oportunidades', {
      nome: document.getElementById('inputNome').value,
      celular: document.getElementById('inputCelular').value,
      responsavelId: document.getElementById('inputDentista').value || null,
      etapaId: document.getElementById('inputColuna').value,
      valor: parseFloat(document.getElementById('inputValor').value) || 0,
      etiqueta: document.getElementById('inputDente').value,
      situacao: situacao,
      classe: classe
    }).then(() => { fecharModalNovoCard(); return carregarFunil(); })
      .catch(er => avisar(er.message))
      .then(() => { if (botao) botao.disabled = false; });
  }
</script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // 1. Marcação do link ativo conforme página atual
      var pathAtual = window.location.pathname.split('/').pop();
      if (!pathAtual) pathAtual = 'painel.html';
      
      var linksNav = document.querySelectorAll('.lateral nav a');
      linksNav.forEach(function(link) {
        var href = link.getAttribute('href');
        if (href === pathAtual) {
          link.classList.add('ativo');
        } else {
          link.classList.remove('ativo');
        }
      });

      // 2. Controle do Menu Lateral no Celular
      var btnMenu = document.getElementById('btn-menu-toggle');
      var lateral = document.querySelector('.lateral');
      var overlay = document.getElementById('overlay');

      function fecharMenu() {
        if (lateral) lateral.classList.remove('aberta');
        if (overlay) overlay.classList.remove('aberta');
      }

      function abrirMenu() {
        if (lateral) lateral.classList.add('aberta');
        if (overlay) overlay.classList.add('aberta');
      }

      if (btnMenu) {
        btnMenu.addEventListener('click', function(e) {
          e.stopPropagation();
          if (lateral && lateral.classList.contains('aberta')) {
            fecharMenu();
          } else {
            abrirMenu();
          }
        });
      }

      if (overlay) {
        overlay.addEventListener('click', fecharMenu);
      }

      // 3. Gerenciador de Tema (Claro / Escuro)
      var btnTema = document.getElementById('btn-tema-toggle');
      var iconeTema = document.getElementById('icone-tema');
      
      var temaSalvo = localStorage.getItem('matrix-tema') || 'escuro';
      
      function aplicarTema(tema) {
        if (tema === 'claro') {
          document.documentElement.setAttribute('data-tema', 'claro');
          if (iconeTema) {
            iconeTema.innerHTML = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';
          }
        } else {
          document.documentElement.removeAttribute('data-tema');
          if (iconeTema) {
            iconeTema.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
          }
        }
      }

      aplicarTema(temaSalvo);

      if (btnTema) {
        btnTema.addEventListener('click', function() {
          var temaAtual = document.documentElement.getAttribute('data-tema') === 'claro' ? 'claro' : 'escuro';
          var novoTema = temaAtual === 'claro' ? 'escuro' : 'claro';
          localStorage.setItem('matrix-tema', novoTema);
          aplicarTema(novoTema);
        });
      }

      // 4. Aplicação dinâmica das cores de marca salvas
      var corMarca = localStorage.getItem('matrix-marca');
      var corMarca2 = localStorage.getItem('matrix-marca-2');

      if (corMarca) {
        document.documentElement.style.setProperty('--marca', corMarca);
      }
      if (corMarca2) {
        document.documentElement.style.setProperty('--marca-2', corMarca2);
      }
    });
  </script>
