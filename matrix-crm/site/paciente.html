<!DOCTYPE html>

<head>
<script>function esc(v){return String(v==null?'':v).replace(/[&<>"'`]/g,function(c){return '&#'+c.charCodeAt(0)+';';});}</script>

      display: flex;

    .logo-icone {

      align-items: center;

<style>
  .odontograma-svg { width: 100%; max-width: 600px; height: auto; margin: 0 auto; display: block; }
  .dente { cursor: pointer; transition: fill 0.3s; stroke: #333; stroke-width: 1; }

<script>
  function mudarAba(evt, id) {
    document.querySelectorAll('.aba-conteudo').forEach(el => el.classList.add('oculto'));
    document.querySelectorAll('.aba').forEach(el => el.classList.remove('ativa'));
    document.getElementById(id).classList.remove('oculto');
    evt.currentTarget.classList.add('ativa');
  }

  // ----- Ficha ligada ao banco (/api/pacientes/:id) -----
  const pacienteId = new URLSearchParams(location.search).get('id');
  const EVENTOS = { 'paciente.criado': 'Lead criado', 'paciente.atualizado': 'Ficha atualizada', 'oportunidade.criada': 'Entrou no funil', 'oportunidade.etapa': 'Mudou de etapa', 'whatsapp.recebida': '💬 Lead no WhatsApp:', 'whatsapp.enviada': '🤖 Morfeus respondeu:', 'whatsapp.humano': '🙋 Atendimento humano', 'whatsapp.transferido': '🙋 Morfeus passou para humano:', 'whatsapp.lead_qualificado': '🔥 Lead qualificado:' };
  const CAMPOS = { nome: 'nome', celular: 'celular', email: 'e-mail', cpf: 'CPF', observacoes: 'observações', saude: 'anamnese', dentista: 'dentista' };
  const $ = id => document.getElementById(id);
  const telefone = d => { d = String(d || ''); const m = d.match(/^(?:55)?(\d{2})(\d{4,5})(\d{4})$/); return m ? `(${m[1]}) ${m[2]}-${m[3]}` : d; };
  const cpfFmt = d => { d = String(d || ''); return d.length === 11 ? d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4') : d; };
  const moeda = v => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

  function descrever(l) {
    const p = l.propriedades || {};
    if (l.evento === 'oportunidade.etapa') return `de "${p.de || '-'}" para "${p.para || '-'}"`;
    if (l.evento === 'oportunidade.criada') return p.etapa ? `etapa "${p.etapa}"` : '';
    if (l.evento === 'paciente.atualizado') return (p.campos || []).map(c => CAMPOS[c] || c).join(', ');
    if (l.evento.startsWith('whatsapp.')) return (p.audio ? '(áudio) ' : '') + (p.texto ? '"' + p.texto + '"' : '');
    return '';
  }

  function preencher(d) {
    const p = d.paciente;
    $('tituloNome').textContent = p.nome; document.title = p.nome + ' · MATRIX CRM';
    $('fNome').value = p.nome; $('fCpf').value = cpfFmt(p.cpf); $('fCelular').value = telefone(p.celular); $('fEmail').value = p.email; $('fObs').value = p.observacoes;
    $('sDiabetes').checked = !!p.saude.diabetes; $('sGestante').checked = !!p.saude.gestante; $('sFumante').checked = !!p.saude.fumante;
    $('oportunidades').innerHTML = d.oportunidades.length
      ? '<h3>No funil</h3>' + d.oportunidades.map(o => `<p><span class="etiqueta etiqueta-info">${esc(o.etapa || 'Sem etapa')}</span> ${esc(o.titulo)}${o.valor ? ' · ' + esc(moeda(o.valor)) : ''}</p>`).join('')
      : '<p class="mudo">Este lead ainda não está no funil.</p>';
    $('linhaDoTempo').innerHTML = d.linhaDoTempo.length
      ? d.linhaDoTempo.map(l => `<p><strong>${esc(new Date(l.quando).toLocaleString('pt-BR'))}</strong> · ${esc(EVENTOS[l.evento] || l.evento)} ${esc(descrever(l))} <span class="mudo">(${esc(l.usuario)})</span></p>`).join('')
      : 'Nada registrado ainda.';
    $('btnSalvar').disabled = false;
  }

  function carregarFicha() {
    if (!pacienteId) { $('tituloNome').textContent = 'nenhum lead escolhido'; $('linhaDoTempo').textContent = 'Abra um lead pela tela Leads ou pelo Funil.'; return; }
    MATRIX.api('GET', 'pacientes/' + encodeURIComponent(pacienteId)).then(preencher).catch(er => { $('tituloNome').textContent = er.message; });
  }

  function salvarFicha() {
    const b = $('btnSalvar'); b.disabled = true;
    MATRIX.api('PATCH', 'pacientes/' + encodeURIComponent(pacienteId), {
      nome: $('fNome').value, cpf: $('fCpf').value, celular: $('fCelular').value, email: $('fEmail').value, observacoes: $('fObs').value,
      saude: { diabetes: $('sDiabetes').checked, gestante: $('sGestante').checked, fumante: $('sFumante').checked }
    }).then(() => { b.textContent = 'Salvo ✓'; setTimeout(() => { b.textContent = 'Salvar'; }, 2500); carregarFicha(); })
      .catch(er => { MATRIX.alertar(er.message); b.disabled = false; });
  }

  document.addEventListener('DOMContentLoaded', carregarFicha);

  document.querySelectorAll('.dente').forEach(dente => {
    dente.addEventListener('click', () => {
      const proc = prompt("Procedimento (Cárie, Limpeza, Implante):");
      if(proc) {
        dente.setAttribute('class', 'dente status-andamento');
        const lista = document.getElementById('lista-procedimentos');
        lista.innerHTML += `<tr><td>${esc(dente.id)}</td><td>${esc(proc)}</td><td><span class="etiqueta etiqueta-alerta">Em andamento</span></td></tr>`;
      }
    });
  });
</script>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // 1. Marcação do link ativo conforme página atual
      var pathAtual = window.location.pathname.split('/').pop();
      if (!pathAtual) pathAtual = 'painel.html';
      
      var linksNav = document.querySelectorAll('.lateral nav a');
      linksNav.forEach(function(link) {
        var href = link.getAttribute('href');
        if (href === pathAtual) {
          link.classList.add('ativo');
        } else {
          link.classList.remove('ativo');
        }
      });

      // 2. Controle do Menu Lateral no Celular
      var btnMenu = document.getElementById('btn-menu-toggle');
      var lateral = document.querySelector('.lateral');
      var overlay = document.getElementById('overlay');

      function fecharMenu() {
        if (lateral) lateral.classList.remove('aberta');
        if (overlay) overlay.classList.remove('aberta');
      }

      function abrirMenu() {
        if (lateral) lateral.classList.add('aberta');
        if (overlay) overlay.classList.add('aberta');
      }

      if (btnMenu) {
        btnMenu.addEventListener('click', function(e) {
          e.stopPropagation();
          if (lateral && lateral.classList.contains('aberta')) {
            fecharMenu();
          } else {
            abrirMenu();
          }
        });
      }

      if (overlay) {
        overlay.addEventListener('click', fecharMenu);
      }

      // 3. Gerenciador de Tema (Claro / Escuro)
      var btnTema = document.getElementById('btn-tema-toggle');
      var iconeTema = document.getElementById('icone-tema');
      
      var temaSalvo = localStorage.getItem('matrix-tema') || 'escuro';
      
      function aplicarTema(tema) {
        if (tema === 'claro') {
          document.documentElement.setAttribute('data-tema', 'claro');
          if (iconeTema) {
            iconeTema.innerHTML = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';
          }
        } else {
          document.documentElement.removeAttribute('data-tema');
          if (iconeTema) {
            iconeTema.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
          }
        }
      }

      aplicarTema(temaSalvo);

      if (btnTema) {
        btnTema.addEventListener('click', function() {
          var temaAtual = document.documentElement.getAttribute('data-tema') === 'claro' ? 'claro' : 'escuro';
          var novoTema = temaAtual === 'claro' ? 'escuro' : 'claro';
          localStorage.setItem('matrix-tema', novoTema);
          aplicarTema(novoTema);
        });
      }

      // 4. Aplicação dinâmica das cores de marca salvas
      var corMarca = localStorage.getItem('matrix-marca');
      var corMarca2 = localStorage.getItem('matrix-marca-2');

      if (corMarca) {
        document.documentElement.style.setProperty('--marca', corMarca);
      }
      if (corMarca2) {
        document.documentElement.style.setProperty('--marca-2', corMarca2);
      }
    });
  </script>
<script src="perfil.js"></script>
